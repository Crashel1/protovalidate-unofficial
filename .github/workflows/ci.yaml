name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build Python 3.8 ABI wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i 3.11 -j 2
          manylinux: 2_28
      - uses: actions/upload-artifact@v5
        with:
          name: tested-wheel
          path: dist/*.whl
  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v6
        with:
          name: tested-wheel
          path: dist
      - name: Install and test wheel
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install --resolution highest dist/*.whl 'pytest>=8.3'
          cd /tmp
          PYTHONPATH="$GITHUB_WORKSPACE/gen" "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/test"
