name: Upload PyPI Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yaml
  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            manylinux: 2_28
          - runner: ubuntu-24.04-arm
            manylinux: 2_28
          - runner: macos-15
            manylinux: auto
          - runner: windows-2025
            manylinux: auto
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i 3.11 -j 2
          manylinux: ${{ matrix.manylinux }}
      - name: Build source package
        if: matrix.runner == 'ubuntu-24.04'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.runner }}
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish on PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
