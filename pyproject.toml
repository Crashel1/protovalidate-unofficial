[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "protovalidate-unofficial"
description = "Protocol Buffer Validation for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["validate", "protobuf", "protocol buffer"]
# Keep our minimum version synced with ./.python-version.
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
version = "2.1.0"
dependencies = ["protobuf>=3.20.3"]

[project.urls]
Homepage = "https://github.com/Crashel1/protovalidate-unofficial"
Source = "https://github.com/Crashel1/protovalidate-unofficial"
Issues = "https://github.com/Crashel1/protovalidate-unofficial/issues"

[dependency-groups]
dev = [
	"google-re2-stubs>=0.1.1",
	"mypy>=1.14,<1.15; python_version < '3.9'",
	"mypy>=1.17.1; python_version >= '3.9'",
	"pytest>=8.3,<8.4; python_version < '3.9'",
	"pytest>=8.4.1; python_version >= '3.9'",
	"ruff>=0.12.0",
	"types-protobuf>=3.20.4.6; python_version < '3.9'",
	"types-protobuf>=5.29.1.20250315; python_version >= '3.9'",
]

[tool.uv]
resolution = "lowest-direct"

[tool.maturin]
module-name = "protovalidate_unofficial._protovalidate"
python-source = "."
python-packages = ["protovalidate_unofficial", "buf"]
features = ["pyo3/extension-module", "pyo3/abi3-py38"]
include = [
  { path = "crates/**/*", format = "sdist" },
  { path = "build.rs", format = "sdist" },
  { path = "UPSTREAM.md", format = "sdist" },
  { path = "scripts/generate_schema.py", format = "sdist" },
]

[tool.ruff]
line-length = 120
target-version = "py38"
lint.select = [
	"A",
	"ARG",
	"B",
	"C",
	"DTZ",
	"E",
	"EM",
	"F",
	"FBT",
	"I",
	"ICN",
	"N",
	"PLC",
	"PLE",
	"PLR",
	"PLW",
	"Q",
	"RUF",
	"S",
	"T",
	"TID",
	"UP",
	"W",
	"YTT",
]
lint.ignore = [
	# Ignore complexity
	"C901",
	"PLR0911",
	"PLR0912",
	"PLR0913",
	"PLR0915",
	# Ignore magic values - in this library, most are obvious in context.
	"PLR2004",
	"UP007",
	"UP045",
]

[tool.ruff.lint.isort]
known-first-party = ["protovalidate-unofficial", "buf"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests can use assertions.
"test/**/*" = ["S101"]

[tool.pytest.ini_options]
# restrict testpaths to speed up test discovery
testpaths = ["test"]

[tool.mypy]
mypy_path = "gen"

[tool.ty.environment]
extra-paths = ["gen"]
